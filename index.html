<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>dwine1.xyz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one narrow column; a site header, then the agenda as a list of numbered rows, each row a link to a project page. */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --fg: #16202b;
    --muted: #5b6876;
    --line: #d3dae2;
    --accent: #2b4fd8;
    --accent-soft: #e2e8fd;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141a; --surface: #161d25; --fg: #e6ebf1; --muted: #93a0ae;
      --line: #27313c; --accent: #8ea6ff; --accent-soft: #1d2848; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141a; --surface: #161d25; --fg: #e6ebf1; --muted: #93a0ae;
    --line: #27313c; --accent: #8ea6ff; --accent-soft: #1d2848; color-scheme: dark;
  }

  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 1rem; line-height: 1.55; }
  .wrap {
    max-width: 44rem; margin: 0 auto;
    padding-block: 3.5rem 4rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 2.5rem;
  }

  header { display: grid; gap: .75rem; }
  .domain { font-family: var(--mono); font-size: .8rem; letter-spacing: .06em; color: var(--muted); }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
  h1 .dot { color: var(--accent); }
  .lede { margin: 0; color: var(--muted); max-width: 34rem; }

  .bar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .75rem; border-bottom: 1px solid var(--line); padding-bottom: .75rem; }
  .bar h2 { font-family: var(--mono); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; margin: 0; color: var(--muted); }
  .bar input {
    font: inherit; font-size: .9rem; color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: .4rem .65rem; width: 14rem; max-width: 100%;
  }
  .bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  ol.agenda { list-style: none; margin: 0; padding: 0; display: grid; }
  .agenda a {
    display: grid; grid-template-columns: 2.5rem 1fr auto; gap: .25rem 1rem; align-items: baseline;
    padding: 1rem .5rem; border-bottom: 1px solid var(--line);
    color: inherit; text-decoration: none; border-radius: 4px;
    transition: background-color .15s ease;
  }
  .agenda a:hover { background: var(--accent-soft); }
  .agenda a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-family: var(--mono); font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .info { min-width: 0; display: grid; gap: .15rem; }
  .name { font-family: var(--display); font-weight: 500; font-size: 1.25rem; line-height: 1.25; }
  .desc { color: var(--muted); font-size: .95rem; }
  .meta { font-family: var(--mono); font-size: .75rem; color: var(--muted); white-space: nowrap; display: flex; gap: .6rem; align-items: baseline; }
  .arrow { color: var(--accent); font-size: 1rem; transition: transform .15s ease; }
  .agenda a:hover .arrow { transform: translateX(3px); }
  @media (max-width: 30rem) {
    .agenda a { grid-template-columns: 2rem 1fr; }
    .meta { grid-column: 2; }
  }

  .sync-row { margin: .25rem 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; }
  .sync-btn {
    font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer;
    padding: .55rem 1rem; border-radius: 999px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; display: inline-flex; align-items: center; gap: .5rem;
  }
  .sync-btn::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: currentColor; opacity: .85; }
  .sync-btn:not([data-sync-state="off"]) { background: var(--surface); color: var(--fg); border-color: var(--line); }
  .sync-btn[data-sync-state="ok"]::before { background: #1f9d55; opacity: 1; }
  .sync-btn[data-sync-state="saving"]::before { background: #d9a400; opacity: 1; }
  .sync-btn[data-sync-state="offline"]::before { background: #d23c3c; opacity: 1; }
  .sync-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sync-hint { color: var(--muted); font-size: .9rem; }

  .empty { color: var(--muted); padding: 1rem .5rem; margin: 0; }
  footer { font-family: var(--mono); font-size: .75rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script src="sync.js?v=3" data-badge="off"></script>
</head>
<body>

<div class="wrap">
  <header>
    <span class="domain">dwine1.xyz</span>
    <h1>Small projects<span class="dot">.</span></h1>
    <p class="lede">A running list of little things I build. Pick one to open it.</p>
    <p class="sync-row"><button type="button" class="sync-btn" data-sync-button data-sync-state="off">Sign in to sync</button>
      <span class="sync-hint">One PIN keeps every project the same on all your devices.</span></p>
  </header>

  <main>
    <div class="bar">
      <h2 id="count">Agenda</h2>
      <input id="filter" type="search" placeholder="Filter projects" aria-label="Filter projects">
    </div>
    <ol class="agenda" id="agenda"></ol>
    <p class="empty" id="empty" hidden>No project matches that filter.</p>
  </main>

  <footer>Add a project: make a folder in /projects and add one line to the list in index.html.</footer>
</div>

<script>
  // The agenda. Each entry is one project page; newest goes at the bottom.
  const projects = [
    { title: "Starter page", description: "A template to copy when starting a new project.", href: "projects/starter/index.html", added: "2026-10-14" },
    { title: "Calender 1", description: "Monthly calendar with US, Turkish and UK holidays and special days like Halloween highlighted; click a date to read about it or save a note.", href: "projects/calender-1/index.html", added: "2026-10-14" },
    { title: "World Time Zones", description: "Analog and digital clocks for cities around the world, with date, UTC offset and how far ahead or behind you they are; search hundreds of cities and add your own.", href: "projects/world-time-zones/index.html", added: "2026-10-15" },
    { title: "Movies and Series", description: "A watchlist for movies and series: track what you plan to watch, are watching and have watched, with ratings, notes and the episode you are on.", href: "projects/movies-and-series/index.html", added: "2026-10-15" },
    { title: "US Map", description: "A zoomable map of the United States with over 16,000 cities and towns, state names inside their borders and county lines; names appear as you zoom in, always at a readable size, and you can search for any city.", href: "projects/us-map/index.html", added: "2026-10-16" },
    { title: "US States", description: "A clean map of the 50 US states and Washington, D.C. with clear state borders and every state named; hover or tap a state to see its name.", href: "projects/us-states/index.html", added: "2026-10-16" },
    { title: "Notes", description: "Take notes with a title and text, see them listed newest first, search them, edit or remove any note, and export or import a backup.", href: "projects/notes/index.html", added: "2026-10-18" },
    { title: "Things I own", description: "A record of the things you own with photos, a description, a link and PDFs like receipts or manuals, plus brand, serial number, price, warranty date and where each thing is kept.", href: "projects/things-i-own/index.html", added: "2026-10-20" },
    { title: "Files", description: "Upload any file, mostly Excel sheets, PDFs and Word documents, and see them on every device you sign in on; open them right on the page, rename, download or remove them. Files are encrypted with your PIN before they leave the browser.", href: "projects/files/index.html", added: "2026-10-23" },
  ];

  const list = document.getElementById("agenda");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");
  const filter = document.getElementById("filter");

  function render(query) {
    const q = query.trim().toLowerCase();
    list.textContent = "";
    let shown = 0;
    projects.forEach((p, i) => {
      if (q && !(p.title + " " + p.description).toLowerCase().includes(q)) return;
      shown++;
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = p.href;
      a.innerHTML = `
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <span class="info"><span class="name"></span><span class="desc"></span></span>
        <span class="meta"><time></time><span class="arrow" aria-hidden="true">→</span></span>`;
      a.querySelector(".name").textContent = p.title;
      a.querySelector(".desc").textContent = p.description;
      const t = a.querySelector("time");
      t.dateTime = p.added;
      t.textContent = p.added;
      li.appendChild(a);
      list.appendChild(li);
    });
    empty.hidden = shown > 0;
    count.textContent = `Agenda · ${projects.length} ${projects.length === 1 ? "project" : "projects"}`;
  }

  filter.addEventListener("input", () => render(filter.value));
  render("");
</script>
</body>
</html>
