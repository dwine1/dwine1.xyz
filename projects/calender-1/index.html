<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<title>Calender 1 · dwine1.xyz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: back link and title on top, then two columns: the month grid on the left, the selected date's details on the right. Stacks on narrow screens. */
  :root {
    --bg: #eef1f4; --surface: #ffffff; --fg: #16202b; --muted: #5b6876; --line: #d3dae2;
    --accent: #2b4fd8; --accent-soft: #e2e8fd;
    --us: #b4232f; --us-soft: #fbe3e5;
    --tr: #0e7a5a; --tr-soft: #dcf3ea;
    --obs: #b45f06; --obs-soft: #fdf1e2;
    --uk: #7a3fc0; --uk-soft: #efe5fb;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141a; --surface: #161d25; --fg: #e6ebf1; --muted: #93a0ae; --line: #27313c;
      --accent: #8ea6ff; --accent-soft: #1d2848; --us: #ff8a93; --us-soft: #3a1c21; --tr: #5fd3a8; --tr-soft: #14322a; --obs: #f0a95a; --obs-soft: #2e2214; --uk: #c4a0f5; --uk-soft: #291d3d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141a; --surface: #161d25; --fg: #e6ebf1; --muted: #93a0ae; --line: #27313c;
    --accent: #8ea6ff; --accent-soft: #1d2848; --us: #ff8a93; --us-soft: #3a1c21; --tr: #5fd3a8; --tr-soft: #14322a; --obs: #f0a95a; --obs-soft: #2e2214; --uk: #c4a0f5; --uk-soft: #291d3d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.55; }
  .wrap {
    max-width: 116rem; margin: 0 auto; padding-block: 2rem 4rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 1.5rem;
  }
  .back { font-family: var(--mono); font-size: .85rem; color: var(--accent); text-decoration: none; justify-self: start; }
  .back:hover { text-decoration: underline; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .8fr) minmax(0, 1fr) minmax(0, .9fr); gap: 1.5rem; align-items: start; }
  .side2 { display: grid; gap: 1.5rem; align-items: start; }
  @media (max-width: 100rem) { .layout { grid-template-columns: minmax(0, 1.3fr) minmax(0, .85fr) minmax(0, 1fr); } .layout { grid-template-rows: auto 1fr; } .cal-col { grid-row: 1 / span 2; } .upcoming { grid-column: 2; grid-row: 1; } .side { grid-column: 3; grid-row: 1 / span 2; } .side2 { grid-column: 2; grid-row: 2; } }
  @media (max-width: 80rem) { .layout { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } .layout { grid-template-rows: none; } .cal-col { grid-row: span 3; } .upcoming, .side, .side2 { grid-column: 2; grid-row: auto; } }
  @media (max-width: 52rem) { .layout { grid-template-columns: 1fr; } .cal-col { grid-row: auto; } .upcoming, .side, .side2 { grid-column: auto; } }
  .upcoming { display: grid; gap: 1rem; }
  .upcoming h2 { font-family: var(--display); font-weight: 500; font-size: 1.25rem; margin: 0; }
  .upcoming .sub { margin: -.75rem 0 0; font-size: .85rem; color: var(--muted); }
  #upcoming-body { display: grid; gap: 1rem; }
  .uday h3 { margin: 0 0 .35rem; font-family: var(--mono); font-weight: 500; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .uday h3 .rel { color: var(--accent); }
  .uday ul { list-style: none; margin: 0; padding: 0; display: grid; }
  .uday button {
    width: 100%; text-align: left; font: inherit; font-size: .9rem; color: inherit; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: .4rem .25rem; cursor: pointer;
    display: grid; grid-template-columns: .7rem 1fr; gap: .5rem; align-items: baseline;
  }
  .uday button:hover { background: var(--accent-soft); }
  .uday .what { min-width: 0; overflow-wrap: anywhere; }
  .uday .kind { display: block; font-family: var(--mono); font-size: .7rem; color: var(--muted); }

  .index { display: grid; gap: 1rem; }
  .index h2 { font-family: var(--display); font-weight: 500; font-size: 1.25rem; margin: 0; }
  #index-body { display: grid; gap: 1.1rem; }
  .index .sub { margin: -.75rem 0 0; font-size: .85rem; color: var(--muted); }
  .cat h3 { margin: 0 0 .35rem; font-family: var(--mono); font-weight: 500; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .4rem; }
  .cat ul { list-style: none; margin: 0; padding: 0; display: grid; }
  .cat button {
    width: 100%; text-align: left; font: inherit; font-size: .9rem; color: inherit; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: .4rem .25rem; cursor: pointer;
    display: grid; grid-template-columns: .7rem 3.6rem 1fr; gap: .5rem; align-items: baseline;
  }
  .cat button:hover { background: var(--accent-soft); }
  .cat .when { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
  .cat .what { min-width: 0; overflow-wrap: anywhere; }
  .cat button.has-next { grid-template-columns: .7rem 3.6rem 1fr auto; }
  .cat button.no-when { grid-template-columns: .7rem 1fr auto; }
  .cat .next { text-align: right; font-family: var(--mono); font-size: .72rem; line-height: 1.35; color: var(--muted); white-space: nowrap; }
  .cat .next b { display: block; font-weight: 500; color: var(--fg); }
  .cat .next.passed b { color: var(--muted); }
  .dot { width: .6rem; height: .6rem; border-radius: 999px; display: inline-block; flex: none; }
  .swatches { display: flex; flex-wrap: wrap; gap: .4rem; }
  .swatches button {
    width: 1.9rem; height: 1.9rem; border-radius: 999px; border: 2px solid transparent; cursor: pointer; padding: 0;
    box-shadow: inset 0 0 0 2px var(--surface);
  }
  .swatches button[aria-checked="true"] { border-color: var(--fg); }
  .lbl { font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .color-field { display: grid; gap: .3rem; }

  .cal-col { display: grid; gap: 1.5rem; }
  .mini .cal-head h2 { font-size: 1.2rem; }
  .day.blank { visibility: hidden; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; }
  .cal-head h2 { font-family: var(--display); font-weight: 500; font-size: 1.5rem; margin: 0; }
  .nav { display: flex; gap: .4rem; }
  .nav button {
    font: inherit; font-size: .85rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: .35rem .65rem; cursor: pointer; min-height: 2.25rem;
  }
  .nav button:hover { border-color: var(--accent); color: var(--accent); }

  .grid { display: grid; grid-template-columns: 2.2rem repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow, .wk { font-family: var(--mono); font-size: .7rem; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .05em; }
  .dow { padding-bottom: .25rem; }
  .wk { display: flex; align-items: center; justify-content: center; }
  .day {
    position: relative; aspect-ratio: 1 / 1; min-height: 2.6rem;
    font: inherit; font-variant-numeric: tabular-nums; color: var(--fg);
    background: transparent; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: .3rem .4rem;
    text-align: left;
  }
  .day:hover { border-color: var(--accent); }
  .day.out { color: var(--muted); opacity: .5; }
  .day.weekend .n { color: var(--muted); }
  .day.us { background: var(--us-soft); }
  .day.tr { background: var(--tr-soft); }
  .day.uk { background: var(--uk-soft); }
  .day.obs:not(.us):not(.tr):not(.uk):not(.selected) { border-style: dashed; border-color: var(--obs); }
  .day.obs:not(.us):not(.tr):not(.uk) { background: var(--obs-soft); }
  .day.today .n { background: var(--accent); color: var(--surface); border-radius: 999px; padding: 0 .35rem; }
  .day.selected, .day.obs.selected { border: 2px solid var(--accent); }
  .n { font-weight: 700; font-size: .95rem; line-height: 1.4; }
  .tags { display: flex; gap: 3px; }
  .tag { font-family: var(--mono); font-size: .6rem; font-weight: 500; line-height: 1; padding: 2px 3px; border-radius: 3px; color: var(--surface); }
  .tag.us { background: var(--us); }
  .tag.tr { background: var(--tr); }
  .tag.obs { background: var(--obs); }
  .tag.uk { background: var(--uk); }

  .legend { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; font-size: .85rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: .4rem; }
  .sw { width: .9rem; height: .9rem; border-radius: 3px; display: inline-block; }

  .detail { display: grid; gap: 1rem; }
  .detail .kicker { font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .detail h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.1rem); line-height: 1.1; margin: 0; }
  .numeric-date { margin: -.6rem 0 0; font-family: var(--mono); font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .holiday { border-left: 4px solid var(--line); padding: .5rem .75rem; border-radius: 4px; display: grid; gap: .25rem; }
  .holiday.us { border-color: var(--us); background: var(--us-soft); }
  .holiday.tr { border-color: var(--tr); background: var(--tr-soft); }
  .holiday.uk { border-color: var(--uk); background: var(--uk-soft); }
  .holiday.obs { border-color: var(--obs); background: var(--obs-soft); border-left-style: dashed; }
  .holiday h3 { margin: 0; font-size: 1.05rem; }
  .holiday .country { font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .holiday p { margin: 0; }
  .facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .4rem 1rem; font-size: .95rem; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .plain { margin: 0; color: var(--muted); }

  .side { display: grid; gap: 1.5rem; }
  .notes { display: grid; gap: .75rem; }
  .notes h2 { font-family: var(--display); font-weight: 500; font-size: 1.25rem; margin: 0; }
  .notes label { font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .notes textarea {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: .6rem .75rem; min-height: 7rem; resize: vertical; width: 100%;
  }
  .notes textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .note-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .note-actions button {
    font: inherit; font-size: .9rem; border-radius: 6px; padding: .45rem .9rem; cursor: pointer; min-height: 2.5rem;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .note-actions .save { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
  .note-actions .remove:hover { border-color: var(--us); color: var(--us); }
  .note-actions button:disabled { opacity: .45; cursor: default; }
  .note-status { font-size: .85rem; color: var(--muted); }
  .note-list { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; }
  .note-list button {
    width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: .55rem .25rem; cursor: pointer; display: grid; grid-template-columns: 6.5rem 1fr; gap: .75rem;
  }
  .note-list button:hover { background: var(--accent-soft); }
  .note-list .when { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
  .note-list .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag.note { background: var(--accent); }
  .repeat { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: .5rem .75rem; }
  .repeat .field { display: grid; gap: .25rem; min-width: 0; }
  .repeat select, .repeat input {
    font: inherit; font-size: .9rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: .4rem .5rem; min-height: 2.5rem; width: 100%;
  }
  .repeat select:focus-visible, .repeat input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .facts .my-notes { display: grid; gap: .25rem; }
  .facts .my-notes .mn { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .6rem; }
  .facts .my-notes .txt { white-space: pre-wrap; }
  .facts .my-notes .mn.done .txt { text-decoration: line-through; color: var(--muted); }
  .status-select {
    font: inherit; font-size: .8rem; border-radius: 999px; padding: .15rem .5rem; cursor: pointer;
    border: 1px solid var(--obs); background: var(--obs-soft); color: var(--fg);
  }
  .status-select.done { border-color: var(--tr); background: var(--tr-soft); }
  .status-select.moved { border-color: var(--uk); background: var(--uk-soft); }
  .status-select.cancelled { border-color: var(--us); background: var(--us-soft); }
  .keep-btn { font: inherit; font-size: .8rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: .15rem .6rem; cursor: pointer; }
  .keep-btn:hover { border-color: var(--accent); color: var(--accent); }
  .facts .my-notes .mn.cancelled .txt { text-decoration: line-through; color: var(--muted); }
  .status-ctrl { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
  .status-ctrl input[type=date] {
    font: inherit; font-size: .8rem; color: var(--fg); background: var(--bg); border: 1px solid var(--uk);
    border-radius: 6px; padding: .15rem .4rem;
  }
  .status-ctrl .moved-lbl { font-size: .8rem; color: var(--muted); }
  .facts .my-notes .mn.moved .txt { color: var(--muted); }
  .tag.note.done { background: var(--tr); }
  .note-pick { display: flex; flex-wrap: wrap; gap: .4rem; }
  .note-pick button {
    font: inherit; font-size: .85rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: .3rem .75rem; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .note-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .quick .field { display: grid; gap: .25rem; min-width: 0; }
  .quick-date { display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: .5rem; }
  .quick select:not(.status-select) {
    font: inherit; font-size: .9rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: .4rem .5rem; min-height: 2.5rem; width: 100%;
  }
  .quick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .expiry { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .75rem; }
  .expiry .field { display: grid; gap: .25rem; min-width: 0; }
  .expiry input {
    font: inherit; font-size: .9rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: .4rem .5rem; min-height: 2.5rem; width: 100%;
  }
  .dmy { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: .5rem; }
  .dmy .field { display: grid; gap: .25rem; min-width: 0; }
  .dmy select {
    font: inherit; font-size: .9rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: .4rem .5rem; min-height: 2.5rem; width: 100%;
  }
  .dmy select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .expiry input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .series-info { margin: 0; font-size: .85rem; color: var(--muted); }
  .note-list .rep { display: block; font-family: var(--mono); font-size: .72rem; color: var(--muted); }

  /* PIN lock: hides the page until the PIN is entered. */
  html.locked .wrap { visibility: hidden; }
  .lock { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: none; place-items: center; padding: 16px; }
  html.locked .lock { display: grid; }
  .lock-card { width: min(22rem, 100%); display: grid; gap: .9rem; text-align: center; }
  .lock-card .icon { font-size: 2rem; }
  .lock-card h2 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; margin: 0; }
  .lock-card p { margin: 0; color: var(--muted); font-size: .95rem; }
  .lock-card input {
    font: inherit; font-family: var(--mono); font-size: 1.5rem; letter-spacing: .4em; text-align: center;
    color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .6rem; width: 100%;
  }
  .lock-card input::placeholder { letter-spacing: normal; font-size: 1rem; }
  .lock-card input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lock-card .go { font: inherit; font-weight: 700; color: var(--surface); background: var(--accent); border: 0; border-radius: 8px; padding: .7rem; cursor: pointer; min-height: 2.75rem; }
  .lock-card .err { color: var(--us); min-height: 1.4em; }
  .lock-card .link { font: inherit; font-size: .85rem; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; justify-self: center; }
  .page-tools { display: flex; gap: .5rem; flex-wrap: wrap; }
  .page-tools button { font: inherit; font-size: .85rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .35rem .75rem; cursor: pointer; min-height: 2.25rem; }
  .page-tools button:hover { border-color: var(--accent); color: var(--accent); }
  .sync-state { font-size: .8rem; color: var(--muted); align-self: center; }
  .sync-state.bad { color: var(--us); }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; }
</style>
<script>
  // Stay unlocked for an hour after a correct PIN (checked here so the page doesn't flash the lock screen).
  (function () {
    let until = 0;
    try { until = +localStorage.getItem("calender1.unlockedUntil") || 0; } catch (e) {}
    if (Date.now() >= until) document.documentElement.classList.add("locked");
  })();
</script>
<script src="../../sync.js?v=3"></script>
</head>
<body>
<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lock-title">
  <form class="lock-card" id="lock-form" autocomplete="off">
    <div class="icon" aria-hidden="true">🔒</div>
    <h2 id="lock-title">Calender 1 is locked</h2>
    <p id="lock-text">Enter your PIN to open it.</p>
    <input id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="PIN" autocomplete="off">
    <input id="lock-pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="Repeat PIN" placeholder="Repeat PIN" hidden autocomplete="off">
    <button class="go" id="lock-go" type="submit">Unlock</button>
    <p class="err" id="lock-err" aria-live="polite"></p>
    <button class="link" id="lock-cancel" type="button" hidden>Cancel</button>
    <button class="link" id="lock-forgot" type="button">Forgot PIN?</button>
  </form>
</div>
<div class="wrap">
  <div class="top">
    <a class="back" href="../../index.html">← All projects</a>
    <div class="page-tools">
      <button id="btn-lock" type="button">🔒 Lock</button>
      <button id="btn-pin" type="button">Change PIN</button>
      <button id="btn-export" type="button" title="Save all notes to a file">⬇ Export notes</button>
      <button id="btn-import" type="button" title="Load notes from an exported file">⬆ Import notes</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <span class="sync-state" id="sync-state" aria-live="polite"></span>
    </div>
  </div>
  <h1>Calender 1</h1>

  <div class="layout">
    <div class="cal-col">
    <section class="panel" aria-label="Calendar">

<script>
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  // --- Holidays -------------------------------------------------------------
  // nthWeekday(y, m, weekday, n): n-th weekday of month m (0-based); n = -1 means last.
  function nthWeekday(y, m, wd, n) {
    if (n > 0) {
      const first = new Date(y, m, 1).getDay();
      return 1 + ((wd - first + 7) % 7) + (n - 1) * 7;
    }
    const lastDate = new Date(y, m + 1, 0).getDate();
    const lastWd = new Date(y, m, lastDate).getDay();
    return lastDate - ((lastWd - wd + 7) % 7);
  }

  function usHolidays(y) {
    return [
      [0, 1, "New Year's Day", "The first day of the year in the Gregorian calendar, a federal holiday across the United States."],
      [0, nthWeekday(y, 0, 1, 3), "Martin Luther King Jr. Day", "Honors civil rights leader Martin Luther King Jr. Held on the third Monday of January, close to his birthday (January 15)."],
      [1, nthWeekday(y, 1, 1, 3), "Washington's Birthday (Presidents' Day)", "Officially honors George Washington, the first U.S. president; widely celebrated as a day for all presidents. Third Monday of February."],
      [4, nthWeekday(y, 4, 1, -1), "Memorial Day", "Remembers the U.S. military personnel who died in service. Last Monday of May, also seen as the unofficial start of summer."],
      [5, 19, "Juneteenth", "Marks June 19, 1865, when enslaved people in Galveston, Texas learned they were free. Federal holiday since 2021."],
      [6, 4, "Independence Day", "Celebrates the adoption of the Declaration of Independence on July 4, 1776. Fireworks, parades and barbecues."],
      [8, nthWeekday(y, 8, 1, 1), "Labor Day", "Honors the American labor movement and workers. First Monday of September, the unofficial end of summer."],
      [9, nthWeekday(y, 9, 1, 2), "Columbus Day / Indigenous Peoples' Day", "Federal holiday on the second Monday of October. Originally commemorating Columbus's 1492 landing; many places now celebrate Indigenous Peoples' Day instead."],
      [10, 11, "Veterans Day", "Honors everyone who has served in the U.S. armed forces. Falls on November 11, the anniversary of the end of World War I."],
      [10, nthWeekday(y, 10, 4, 4), "Thanksgiving Day", "A day of giving thanks, traditionally with a turkey dinner with family. Fourth Thursday of November."],
      [11, 25, "Christmas Day", "Celebrates the birth of Jesus Christ. A federal holiday and the biggest gift-giving day of the year."],
    ].map(([m, d, name, text]) => ({ y, m, d, name, text, country: "us" }));
  }

  // England & Wales bank holidays. A holiday on a weekend moves to the next free weekday.
  function ukHolidays(y) {
    const [em, ed] = easter(y);
    const list = [
      [new Date(y, em, ed - 2), "Good Friday", "The Friday before Easter, marking the crucifixion of Jesus. A bank holiday across the UK."],
      [new Date(y, em, ed + 1), "Easter Monday", "The day after Easter Sunday. A bank holiday in England, Wales and Northern Ireland."],
      [new Date(y, 4, nthWeekday(y, 4, 1, 1)), "Early May bank holiday", "First Monday of May, the UK's May Day holiday. Maypoles and morris dancing in some villages."],
      [new Date(y, 4, nthWeekday(y, 4, 1, -1)), "Spring bank holiday", "Last Monday of May, originally the Whit Monday holiday."],
      [new Date(y, 7, nthWeekday(y, 7, 1, -1)), "Summer bank holiday", "Last Monday of August in England and Wales, the last long weekend of summer."],
    ];
    const taken = new Set(list.map(([d]) => key(d)));
    const fixed = [
      [0, 1, "New Year's Day", "The first day of the year, a bank holiday across the UK."],
      [11, 25, "Christmas Day", "Celebrates the birth of Jesus: presents, crackers, turkey dinner and the King's speech at 3 p.m."],
      [11, 26, "Boxing Day", "The day after Christmas, traditionally when servants and tradespeople received gifts (\"Christmas boxes\"). Now known for sport and sales."],
    ];
    fixed.forEach(([m, d, name, text]) => {
      let dt = new Date(y, m, d);
      if (dt.getDay() === 0 || dt.getDay() === 6) {
        list.push([dt, name, text]);
        do { dt = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + 1); }
        while (dt.getDay() === 0 || dt.getDay() === 6 || taken.has(key(dt)));
        list.push([dt, name + " (substitute day)", `${name} falls on a weekend this year, so the bank holiday moves to this weekday.`]);
      } else list.push([dt, name, text]);
      taken.add(key(dt));
    });
    return list.map(([dt, name, text]) => ({ y: dt.getFullYear(), m: dt.getMonth(), d: dt.getDate(), name, text, country: "uk" }));
  }

  // Religious holidays in Turkey follow the lunar Hijri calendar; dates below are the official first days per year.
  const RAMAZAN = { 2024: [3, 10], 2025: [2, 30], 2026: [2, 20], 2027: [2, 9], 2028: [1, 26], 2029: [1, 14], 2030: [1, 4] };
  const KURBAN  = { 2024: [5, 16], 2025: [5, 6],  2026: [4, 27], 2027: [4, 16], 2028: [4, 5],  2029: [3, 24], 2030: [3, 13] };

  function trHolidays(y) {
    const list = [
      [0, 1, "Yılbaşı (New Year's Day)", "The first day of the year, a public holiday in Turkey."],
      [3, 23, "Ulusal Egemenlik ve Çocuk Bayramı", "National Sovereignty and Children's Day. Marks the opening of the Grand National Assembly in 1920; Atatürk dedicated the day to children."],
      [4, 1, "Emek ve Dayanışma Günü", "Labour and Solidarity Day, Turkey's May Day holiday for workers."],
      [4, 19, "Atatürk'ü Anma, Gençlik ve Spor Bayramı", "Commemoration of Atatürk, Youth and Sports Day. Marks May 19, 1919, when Atatürk landed in Samsun to start the War of Independence."],
      [6, 15, "Demokrasi ve Milli Birlik Günü", "Democracy and National Unity Day, remembering those who resisted the coup attempt of July 15, 2016."],
      [7, 30, "Zafer Bayramı", "Victory Day. Celebrates the decisive victory at Dumlupınar in 1922 during the War of Independence."],
      [9, 28, "Cumhuriyet Bayramı Arifesi", "Republic Day eve. A half-day holiday from the afternoon."],
      [9, 29, "Cumhuriyet Bayramı", "Republic Day. Celebrates the proclamation of the Republic of Turkey on October 29, 1923."],
    ];
    const addFeast = (start, days, name, text) => {
      if (!start) return;
      const eve = new Date(y, start[0], start[1] - 1);
      list.push([eve.getMonth(), eve.getDate(), name + " Arifesi", "The eve of " + name + ". A half-day holiday from the afternoon."]);
      for (let i = 0; i < days; i++) {
        const dt = new Date(y, start[0], start[1] + i);
        list.push([dt.getMonth(), dt.getDate(), `${name} (day ${i + 1} of ${days})`, text]);
      }
    };
    addFeast(RAMAZAN[y], 3, "Ramazan Bayramı", "Eid al-Fitr, the feast that ends the month of Ramadan fasting. Families visit elders, children collect sweets and pocket money.");
    addFeast(KURBAN[y], 4, "Kurban Bayramı", "Eid al-Adha, the Feast of Sacrifice. Families sacrifice an animal and share the meat with relatives and people in need.");
    return list.map(([m, d, name, text]) => ({ y, m, d, name, text, country: "tr" }));
  }

  // Easter Sunday (Anonymous Gregorian algorithm); returns [month, day].
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    return [Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1];
  }

  // Well-known days that are not official days off. country: "us", "tr" or "both".
  function observances(y) {
    const thanksgiving = nthWeekday(y, 10, 4, 4);
    const [em, ed] = easter(y);
    return [
      [1, 2, "us", "Groundhog Day", "If Punxsutawney Phil sees his shadow in Pennsylvania, folklore says six more weeks of winter."],
      [1, nthWeekday(y, 1, 0, 2), "us", "Super Bowl Sunday", "The NFL championship game, one of the most watched TV broadcasts in America. Usually the second Sunday of February."],
      [1, 14, "both", "Valentine's Day (Sevgililer Günü)", "A day for couples: flowers, chocolates and cards. Celebrated in both the US and Turkey."],
      [2, nthWeekday(y, 2, 0, 2), "us", "Daylight saving time starts", "Clocks in most of the US move forward one hour at 2 a.m. Turkey no longer changes its clocks."],
      [2, 8, "both", "International Women's Day (Dünya Kadınlar Günü)", "A worldwide day celebrating women's achievements and calling for equal rights."],
      [2, 17, "us", "St. Patrick's Day", "Irish heritage day: green everything, parades and the Chicago River dyed green."],
      [2, 18, "tr", "Çanakkale Zaferi", "Çanakkale Victory and Martyrs' Remembrance Day, marking the 1915 naval victory at Gallipoli."],
      [3, 1, "both", "April Fools' Day (1 Nisan Şakası)", "A day for pranks and hoaxes."],
      [em, ed, "us", "Easter Sunday", "Christian celebration of the resurrection of Jesus. Egg hunts, the Easter Bunny and family meals. Date moves every year."],
      [3, 22, "both", "Earth Day", "A worldwide day for environmental awareness, first held in 1970 in the US."],
      [4, 5, "us", "Cinco de Mayo", "Celebrates Mexican heritage in the US, marking the 1862 Battle of Puebla."],
      [4, nthWeekday(y, 4, 0, 2), "both", "Mother's Day (Anneler Günü)", "A day to honor mothers, on the second Sunday of May in both the US and Turkey."],
      [5, nthWeekday(y, 5, 0, 3), "both", "Father's Day (Babalar Günü)", "A day to honor fathers, on the third Sunday of June in both the US and Turkey."],
      [9, 31, "us", "Halloween", "Costumes, jack-o'-lanterns and trick-or-treating for candy. Rooted in the old Celtic festival of Samhain."],
      [10, nthWeekday(y, 10, 0, 1), "us", "Daylight saving time ends", "Clocks in most of the US move back one hour at 2 a.m."],
      [10, nthWeekday(y, 10, 2, 1) + (nthWeekday(y, 10, 2, 1) === 1 ? 7 : 0), "us", "Election Day", "The Tuesday after the first Monday of November, when US general elections are held."],
      [10, 10, "tr", "Atatürk'ü Anma Günü", "Anniversary of Atatürk's death in 1938. At 9:05 a.m. sirens sound and the whole country stops for a moment of silence."],
      [10, 24, "tr", "Öğretmenler Günü", "Teachers' Day in Turkey. Students bring flowers and cards to their teachers."],
      [10, thanksgiving + 1, "us", "Black Friday", "The day after Thanksgiving, famous for doorbuster sales. Traditionally the start of the holiday shopping season."],
      [10, thanksgiving + 2, "us", "Small Business Saturday", "Encourages holiday shopping at local, independent stores."],
      [10, thanksgiving + 4, "us", "Cyber Monday", "The Monday after Thanksgiving, the online counterpart to Black Friday."],
      [11, 24, "us", "Christmas Eve", "The evening before Christmas: family dinners, church services and last-minute gift wrapping."],
      [11, 31, "both", "New Year's Eve (Yılbaşı Gecesi)", "The last night of the year, celebrated with parties, countdowns and fireworks at midnight."],
    ].map(([m, d, country, name, text]) => ({ y, m, d, name, text, country, obs: true }));
  }

  const holidayCache = {};
  function holidaysFor(y) {
    if (!holidayCache[y]) {
      const map = {};
      [...usHolidays(y), ...trHolidays(y), ...ukHolidays(y), ...observances(y)].forEach(h => {
        const k = key(new Date(h.y, h.m, h.d));
        (map[k] = map[k] || []).push(h);
      });
      holidayCache[y] = map;
    }
    return holidayCache[y];
  }
  const holidaysOn = date => holidaysFor(date.getFullYear())[key(date)] || [];

  // --- Date helpers ---------------------------------------------------------
  function key(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
  function sameDay(a, b) { return key(a) === key(b); }
  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  }
  function daysBetween(a, b) {
    return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  }
  function dayOfYear(d) { return daysBetween(new Date(d.getFullYear(), 0, 1), d) + 1; }
  function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function ordinal(n) { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function relative(n) {
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n === -1) return "Yesterday";
    return n > 0 ? `In ${n} days` : `${-n} days ago`;
  }
  function nextHoliday(from) {
    for (let i = 1; i <= 400; i++) {
      const d = new Date(from.getFullYear(), from.getMonth(), from.getDate() + i);
      const hs = holidaysOn(d).filter(h => !h.obs);
      if (hs.length) return { d, h: hs[0], days: i };
    }
    return null;
  }

  // --- Notes (saved in this browser only) ----------------------------------
  const NOTES_KEY = "calender1.notes";
  function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function loadNotes() {
    try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; } catch (e) { return {}; }
  }
  let notes = loadNotes();
  function storeNotes() {
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch (e) { return false; }
    if (window.calSync) calSync.changed();
    return true;
  }
  function parseIso(k) { const [y, m, d] = k.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); }
  // Notes are keyed by their start date ("2026-10-20", then "2026-10-20~2" for a second note that day). A value is a plain string (one-off) or { text, freq, until }.
  function getNote(k) {
    const v = notes[k];
    if (v == null) return null;
    return typeof v === "string" ? { text: v, freq: "none", until: null } : v;
  }
  const FREQ_LABEL = { daily: "Daily", weekly: "Weekly", biweekly: "Every 2 weeks", monthly: "Monthly", m3: "Every 3 months", m4: "Every 4 months", m6: "Every 6 months", m9: "Every 9 months", yearly: "Yearly" };
  function occursOn(k, n, d) {
    const start = parseIso(k);
    const diff = daysBetween(start, d);
    if (diff === 0) return true;
    if (n.expiry && n.expiry.date === iso(d)) return true;
    if (n.moved && Object.values(n.moved).includes(iso(d))) return true;
    if (n.freq === "none" || diff < 0 || !n.until || daysBetween(d, parseIso(n.until)) < 0) return false;
    switch (n.freq) {
      case "daily": return true;
      case "weekly": return diff % 7 === 0;
      case "biweekly": return diff % 14 === 0;
      case "monthly": return d.getDate() === start.getDate();
      case "m3": case "m4": case "m6": case "m9": {
        const months = (d.getFullYear() - start.getFullYear()) * 12 + d.getMonth() - start.getMonth();
        return d.getDate() === start.getDate() && months % Number(n.freq.slice(1)) === 0;
      }
      case "yearly": return d.getDate() === start.getDate() && d.getMonth() === start.getMonth();
    }
    return false;
  }
  // Start-date keys of every note that lands on date d; its own one-off/start note first.
  function notesOn(d) {
    return Object.keys(notes).filter(k => occursOn(k, getNote(k), d)).sort();
  }
  // Repeating notes track Completed/Waiting per occurrence date in note.done.
  const isDone = (k, d) => { const n = getNote(k); return !!(n && n.done && n.done[iso(d)]); };
  function setDone(k, d, done) {
    const n = getNote(k);
    if (!n || n.freq === "none") return;
    n.done = n.done || {};
    if (done) n.done[iso(d)] = true; else delete n.done[iso(d)];
    notes[k] = n;
    storeNotes();
  }
  // Per-occurrence status of a repeating note: waiting, done, or moved (note.moved maps original date -> new date).
  const movedTo = (k, d) => { const n = getNote(k); return n && n.moved ? n.moved[iso(d)] || null : null; };
  const movedFrom = (k, d) => { const n = getNote(k); if (!n || !n.moved) return null; const e = Object.entries(n.moved).find(([, to]) => to === iso(d)); return e ? e[0] : null; };
  const isCancelled = (k, d) => { const n = getNote(k); return !!(n && n.cancelled && n.cancelled[iso(d)]); };
  const statusOf = (k, d) => movedTo(k, d) ? "moved" : isCancelled(k, d) ? "cancelled" : isDone(k, d) ? "done" : "waiting";
  function setCancelled(k, d, on) {
    const n = getNote(k);
    n.cancelled = n.cancelled || {};
    if (on) n.cancelled[iso(d)] = true; else delete n.cancelled[iso(d)];
    notes[k] = n;
    storeNotes();
  }
  function setMoved(k, d, to) {
    const n = getNote(k);
    n.moved = n.moved || {};
    if (to) { n.moved[iso(d)] = to; if (n.done) delete n.done[iso(d)]; if (n.cancelled) delete n.cancelled[iso(d)]; } else delete n.moved[iso(d)];
    notes[k] = n;
    storeNotes();
  }
  // Waiting / Completed / Delayed-changed dropdown (plus a date box when delayed) for note k on date d.
  function statusControl(k, d, after) {
    const wrap = document.createElement("span");
    wrap.className = "status-ctrl";
    const sel = document.createElement("select");
    const st = statusOf(k, d);
    const from = movedFrom(k, d);
    sel.className = "status-select" + (st === "waiting" ? "" : " " + st);
    sel.setAttribute("aria-label", `Status of "${getNote(k).text}" on this date`);
    sel.innerHTML = `<option value="waiting">◷ Waiting</option><option value="done">✓ Completed</option>${from ? "" : `<option value="moved">↷ Delayed / changed</option>`}<option value="cancelled">✕ Cancelled</option><option value="keep">↺ Keep the same</option>`;
    sel.value = st;
    wrap.appendChild(sel);
    const date = document.createElement("input");
    date.type = "date";
    date.setAttribute("aria-label", "New date");
    const lbl = document.createElement("span");
    lbl.className = "moved-lbl";
    lbl.textContent = "to";
    // "Keep the same" closes the new-date box and leaves this occurrence on its original date.
    const keep = document.createElement("button");
    keep.type = "button";
    keep.className = "keep-btn";
    keep.textContent = "Keep the same";
    keep.addEventListener("click", () => {
      if (movedTo(k, d)) { setMoved(k, d, null); after("Kept on its original date."); return; }
      sel.value = st === "moved" ? "waiting" : st;
      sel.className = "status-select" + (sel.value === "waiting" ? "" : " " + sel.value);
      lbl.remove(); date.remove(); keep.remove();
    });
    if (st === "moved") { date.value = movedTo(k, d); wrap.append(lbl, date, keep); }
    sel.addEventListener("change", () => {
      if (sel.value === "moved") {
        sel.className = "status-select moved";
        wrap.append(lbl, date, keep);
        date.focus();
        try { date.showPicker(); } catch (e) {}
        return;
      }
      if (sel.value === "keep") {
        // Back to the original date as Waiting: undo a delay (from either end) and any cancel.
        if (movedTo(k, d)) setMoved(k, d, null);
        if (from) setMoved(k, parseIso(from), null);
        setCancelled(k, d, false);
        setDone(k, d, false);
        after(from ? `Moved back to ${fmt(from)}.` : "Kept on its original date.");
        return;
      }
      if (movedTo(k, d)) setMoved(k, d, null);
      setCancelled(k, d, sel.value === "cancelled");
      setDone(k, d, sel.value === "done");
      after({ done: "Marked completed for this date.", waiting: "Marked waiting for this date.", cancelled: "Cancelled for this date." }[sel.value]);
    });
    date.addEventListener("change", () => {
      if (!date.value || date.value === iso(d)) return;
      setMoved(k, d, date.value);
      after(`Moved to ${fmt(date.value)}.`);
    });
    return wrap;
  }

  // Note colors: each note picks one; it tints the note's tag on the calendar and its dot in lists.
  const NOTE_COLORS = [
    ["blue", "#2b6cd8"], ["red", "#d64545"], ["orange", "#e07b1a"], ["yellow", "#c99a00"],
    ["green", "#2e9d5b"], ["teal", "#1595a3"], ["purple", "#8a4fd8"], ["pink", "#d6458f"],
  ];
  const colorHex = id => (NOTE_COLORS.find(c => c[0] === id) || NOTE_COLORS[0])[1];
  const noteColor = k => colorHex(getNote(k).color);
  function makeSwatches(el, onPick) {
    let value = "blue";
    const set = v => {
      value = NOTE_COLORS.some(c => c[0] === v) ? v : "blue";
      el.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.c === value)));
    };
    NOTE_COLORS.forEach(([id, hex]) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.c = id; b.style.background = hex;
      b.setAttribute("role", "radio"); b.setAttribute("aria-label", id);
      b.addEventListener("click", () => { set(id); if (onPick) onPick(id); });
      el.appendChild(b);
    });
    set("blue");
    return { get: () => value, set };
  }

  // Text to show for note k on date d: on a note's expiry date, its expiry text.
  function textOn(k, d) {
    const n = getNote(k);
    if (n.moved && n.moved[iso(d)]) return `${n.text} (moved to ${fmt(n.moved[iso(d)])})`;
    const mf = movedFrom(k, d);
    if (mf) return `${n.text} (moved from ${fmt(mf)})`;
    if (n.expiry && n.expiry.date === iso(d) && k.slice(0, 10) !== iso(d)) {
      return `⏳ ${n.expiry.text || "Expires"} (expiry of "${n.text}")`;
    }
    return n.expiry ? `${n.text} (expires ${fmt(n.expiry.date)})` : n.text;
  }
  // Build what gets stored: a string, a repeating series, or a one-off with an expiry date.
  function buildNote(text, freq, until, expDate, expText, prev, color) {
    if (freq !== "none") return { text, freq, until, color, done: (prev && prev.done) || {}, moved: (prev && prev.moved) || {}, cancelled: (prev && prev.cancelled) || {} };
    if (expDate) return { text, freq: "none", until: null, color, expiry: { date: expDate, text: expText } };
    return { text, freq: "none", until: null, color };
  }
  function checkExpiry(start, expDate) {
    if (expDate && expDate <= start) return `The expiry date has to be after ${fmt(start)}.`;
    return "";
  }
  function newKey(d) {
    const base = iso(d);
    if (!notes[base]) return base;
    let i = 2;
    while (notes[`${base}~${i}`]) i++;
    return `${base}~${i}`;
  }

  // --- Rendering ------------------------------------------------------------
  const today = new Date();
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let selected = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  const grid = document.getElementById("grid");
  const label = document.getElementById("month-label");
  const detail = document.getElementById("detail");

  function renderCalendar() {
    label.textContent = `${MONTHS[view.getMonth()]} ${view.getFullYear()}`;
    renderMonth(grid, view, true);
    const nx = new Date(view.getFullYear(), view.getMonth() + 1, 1), pv = new Date(view.getFullYear(), view.getMonth() - 1, 1);
    document.getElementById("next-label").textContent = `${MONTHS[nx.getMonth()]} ${nx.getFullYear()}`;
    document.getElementById("prev-label").textContent = `${MONTHS[pv.getMonth()]} ${pv.getFullYear()}`;
    renderMonth(document.getElementById("next-grid"), nx, false);
    renderMonth(document.getElementById("prev-grid"), pv, false);
    renderIndex();
  }

  // Draw one month into a grid. The main grid shows neighbouring days greyed out; the extra grids leave them blank.
  function renderMonth(grid, view, main) {
    grid.textContent = "";
    const head = ["Wk", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    head.forEach(h => { const el = document.createElement("div"); el.className = "dow"; el.textContent = h; grid.appendChild(el); });

    const start = new Date(view.getFullYear(), view.getMonth(), 1 - view.getDay());
    const weeks = Math.ceil((view.getDay() + new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate()) / 7);
    for (let w = 0; w < weeks; w++) {
      const monday = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + 1);
      const wk = document.createElement("div");
      wk.className = "wk"; wk.textContent = isoWeek(monday); wk.title = "ISO week " + isoWeek(monday);
      grid.appendChild(wk);
      for (let i = 0; i < 7; i++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + i);
        const hs = holidaysOn(d);
        const b = document.createElement("button");
        b.className = "day";
        if (!main && d.getMonth() !== view.getMonth()) {
          b.classList.add("blank"); b.tabIndex = -1; b.setAttribute("aria-hidden", "true");
          grid.appendChild(b);
          continue;
        }
        if (d.getMonth() !== view.getMonth()) b.classList.add("out");
        if (i === 0 || i === 6) b.classList.add("weekend");
        if (sameDay(d, today)) b.classList.add("today");
        if (sameDay(d, selected)) b.classList.add("selected");
        const countries = [...new Set(hs.filter(h => !h.obs).map(h => h.country))];
        countries.forEach(c => b.classList.add(c));
        if (countries.length > 1) {
          const step = 100 / countries.length;
          b.style.background = `linear-gradient(135deg, ${countries.map((c, j) => `var(--${c}-soft) ${j * step}% ${(j + 1) * step}%`).join(", ")})`;
        }
        const hasObs = hs.some(h => h.obs);
        if (hasObs) b.classList.add("obs");
        const dayNotes = notesOn(d);
        const hasNote = dayNotes.length > 0;
        const allDone = hasNote && dayNotes.every(k => getNote(k).freq !== "none" && statusOf(k, d) === "done");
        b.innerHTML = `<span class="n">${d.getDate()}</span><span class="tags">${countries.map(c => `<span class="tag ${c}">${c.toUpperCase()}</span>`).join("")}${hasObs ? `<span class="tag obs" title="Special day">★</span>` : ""}${hasNote ? (allDone ? `<span class="tag note done" title="Completed">✓</span>` : [...new Set(dayNotes.map(noteColor))].slice(0, 3).map(c => `<span class="tag note" style="background:${c}" title="Has a note">✎</span>`).join("")) : ""}</span>`;
        b.setAttribute("aria-label", `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}${hs.length ? ": " + hs.map(h => h.name).join(", ") : ""}${hasNote ? ", has a note" : ""}`);
        b.addEventListener("click", () => {
          selected = d;
          if (main && d.getMonth() !== view.getMonth()) setView(new Date(d.getFullYear(), d.getMonth(), 1));
          renderCalendar(); renderDetail(); renderNotes();
        });
        grid.appendChild(b);
      }
    }
  }
  function setView(v) { view = v; }

  // The next date that matters for note k, counted from today: next repeat, expiry date, or the note's own date.
  function nextFor(k) {
    const n = getNote(k);
    const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    if (n.freq !== "none") {
      const end = parseIso(n.until);
      const start = parseIso(k);
      let d = daysBetween(start, t) > 0 ? t : start;
      for (let i = 0; i < 4000 && daysBetween(d, end) >= 0; i++) {
        if (occursOn(k, n, d) && !(n.moved && n.moved[iso(d)]) && !(n.cancelled && n.cancelled[iso(d)])) return { label: "Next", d };
        d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      }
      return { label: "Ended", d: null };
    }
    if (n.expiry) {
      const e = parseIso(n.expiry.date);
      return daysBetween(t, e) >= 0 ? { label: "Expires", d: e } : { label: "Expired", d: null };
    }
    const own = parseIso(k);
    return daysBetween(t, own) >= 0 ? { label: "On", d: own } : { label: "Passed", d: null };
  }
  function daysLeft(d) {
    const n = daysBetween(today, d);
    return n === 0 ? "today" : n === 1 ? "in 1 day" : `in ${n} days`;
  }

  // Right-hand column: every date in the shown month that has something, grouped by category.
  // "Coming up": today through 7 days ahead, stretched to the following Sunday.
  function renderUpcoming() {
    const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let end = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 7);
    if (end.getDay() !== 0) end = new Date(end.getFullYear(), end.getMonth(), end.getDate() + (7 - end.getDay()));
    const short = d => `${DAYS[d.getDay()].slice(0, 3)}, ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
    document.getElementById("upcoming-sub").textContent = `Today through ${short(end)}`;
    const body = document.getElementById("upcoming-body");
    body.textContent = "";
    const kindColor = { us: "var(--us)", tr: "var(--tr)", uk: "var(--uk)" };
    const kindName = { us: "US holiday", tr: "Turkey holiday", uk: "UK bank holiday" };
    for (let d = t; daysBetween(d, end) >= 0; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
      const items = [];
      notesOn(d).forEach(k => {
        const n = getNote(k);
        const status = n.freq !== "none" ? ({ done: " · completed", waiting: " · waiting", moved: " · delayed", cancelled: " · cancelled" })[statusOf(k, d)] : "";
        items.push({ color: noteColor(k), text: textOn(k, d), kind: "My note" + status });
      });
      holidaysOn(d).forEach(h => items.push({
        color: h.obs ? "var(--obs)" : kindColor[h.country], text: h.name,
        kind: h.obs ? "Special day" : kindName[h.country],
      }));
      if (!items.length) continue;
      const rel = daysBetween(t, d);
      const sec = document.createElement("div");
      sec.className = "uday";
      sec.innerHTML = `<h3></h3><ul></ul>`;
      sec.querySelector("h3").append(short(d) + " · ");
      const r = document.createElement("span"); r.className = "rel"; r.textContent = rel === 0 ? "today" : rel === 1 ? "tomorrow" : `in ${rel} days`;
      sec.querySelector("h3").appendChild(r);
      const day = d;
      items.forEach(it => {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.innerHTML = `<i class="dot" style="background:${it.color}"></i><span class="what"></span>`;
        b.querySelector(".what").textContent = it.text;
        const k = document.createElement("span"); k.className = "kind"; k.textContent = it.kind;
        b.querySelector(".what").appendChild(k);
        b.addEventListener("click", () => {
          selected = day; view = new Date(day.getFullYear(), day.getMonth(), 1);
          renderCalendar(); renderDetail(); renderNotes();
        });
        li.appendChild(b);
        sec.querySelector("ul").appendChild(li);
      });
      body.appendChild(sec);
    }
    if (!body.children.length) body.innerHTML = `<p class="plain">Nothing coming up this week.</p>`;
  }

  function renderIndex() {
    renderUpcoming();
    document.getElementById("index-sub").textContent = "All your notes, plus holidays and special days in the next 12 months";
    const cats = [
      { title: "My notes", color: "var(--accent)", items: [] },
      { title: "US holidays", color: "var(--us)", items: [] },
      { title: "Turkey holidays", color: "var(--tr)", items: [] },
      { title: "UK bank holidays", color: "var(--uk)", items: [] },
      { title: "Special days", color: "var(--obs)", items: [] },
    ];
    // Notes: each one once, upcoming first (by next date), finished ones last.
    cats[0].items = Object.keys(notes).map(k => {
      const next = nextFor(k);
      return { d: next.d || parseIso(k), text: getNote(k).text, color: noteColor(k), next, sort: next.d ? daysBetween(today, next.d) : 1e9 + daysBetween(parseIso(k), today) };
    }).sort((a, b) => a.sort - b.sort);
    // Holidays and special days: from today through the next 12 months.
    const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const end = new Date(t.getFullYear() + 1, t.getMonth(), t.getDate());
    for (let d = t; d < end; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
      holidaysOn(d).forEach(h => {
        const c = h.obs ? cats[4] : cats[{ us: 1, tr: 2, uk: 3 }[h.country]];
        c.items.push({ d, when: true, text: h.obs && h.country !== "us" ? `${h.name} (${h.country === "tr" ? "TR" : "US & TR"})` : h.name, color: c.color, next: { label: "", d, short: true } });
      });
    }
    const body = document.getElementById("index-body");
    body.textContent = "";
    const filled = cats.filter(c => c.items.length);
    filled.forEach(c => {
      const sec = document.createElement("div");
      sec.className = "cat";
      sec.innerHTML = `<h3><i class="dot" style="background:${c.color}"></i></h3><ul></ul>`;
      sec.querySelector("h3").append(`${c.title} · ${c.items.length}`);
      c.items.forEach(it => {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.className = it.when ? "has-next" : "no-when";
        b.innerHTML = `<i class="dot" style="background:${it.color}"></i>${it.when ? `<span class="when"></span>` : ""}<span class="what"></span>`;
        if (it.when) b.querySelector(".when").textContent = `${MONTHS[it.d.getMonth()].slice(0, 3)} ${it.d.getDate()}`;
        b.querySelector(".what").textContent = it.text;
        const nx = document.createElement("span");
        nx.className = "next" + (it.next.d ? "" : " passed");
        if (it.next.short) nx.textContent = daysLeft(it.next.d);
        else {
          nx.innerHTML = "<b></b>";
          if (it.next.d) {
            nx.querySelector("b").textContent = `${it.next.label} ${fmt(iso(it.next.d))}`;
            nx.append(daysLeft(it.next.d));
          } else nx.querySelector("b").textContent = it.next.label;
        }
        b.appendChild(nx);
        b.addEventListener("click", () => {
          selected = it.d;
          view = new Date(it.d.getFullYear(), it.d.getMonth(), 1);
          renderCalendar(); renderDetail(); renderNotes();
        });
        li.appendChild(b);
        sec.querySelector("ul").appendChild(li);
      });
      body.appendChild(sec);
    });
  }

  function renderDetail() {
    const d = selected;
    const hs = holidaysOn(d);
    const rel = daysBetween(today, d);
    const totalDays = isLeap(d.getFullYear()) ? 366 : 365;
    const doy = dayOfYear(d);
    const nh = nextHoliday(d);
    const myNotes = notesOn(d);

    let html = `<p class="kicker">${DAYS[d.getDay()]} · ${relative(rel)}</p>
      <h2>${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}</h2>
      <p class="numeric-date">${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}</p>`;

    if (hs.length) {
      const where = { us: "United States", tr: "Turkey", uk: "United Kingdom (England & Wales)", both: "United States & Turkey" };
      html += hs.map(h => `<div class="holiday ${h.obs ? "obs" : h.country}">
          <span class="country">${where[h.country]} · ${h.obs ? "special day" : h.country === "uk" ? "bank holiday" : "public holiday"}</span>
          <h3>${h.name}</h3><p>${h.text}</p></div>`).join("");
    } else {
      const weekend = d.getDay() === 0 || d.getDay() === 6;
      html += `<p class="plain">Nothing special on this date. It is ${weekend ? "a weekend day" : "a regular working day"}, the ${ordinal(d.getDate())} day of ${MONTHS[d.getMonth()]}.</p>`;
    }

    html += `<dl class="facts">
        <dt>Day of year</dt><dd>${doy} of ${totalDays}</dd>
        <dt>Days left in year</dt><dd>${totalDays - doy}</dd>
        <dt>ISO week</dt><dd>${isoWeek(d)}</dd>
        <dt>Quarter</dt><dd>Q${Math.floor(d.getMonth() / 3) + 1}</dd>
        <dt>From today</dt><dd>${relative(rel)}</dd>
        ${myNotes.length ? `<dt>My notes</dt><dd class="my-notes">${myNotes.map(k => `<span class="mn"><i class="dot" style="background:${noteColor(k)}"></i><span class="txt"></span></span>`).join("")}</dd>` : ""}
        ${nh ? `<dt>Next public holiday</dt><dd>${nh.h.name} (${nh.h.country.toUpperCase()}), ${MONTHS[nh.d.getMonth()]} ${nh.d.getDate()}, in ${nh.days} ${nh.days === 1 ? "day" : "days"}</dd>` : ""}
      </dl>`;
    detail.innerHTML = html;
    detail.querySelectorAll(".my-notes .mn").forEach((el, i) => {
      const k = myNotes[i], n = getNote(k);
      el.querySelector(".txt").textContent = textOn(k, d);
      if (n.freq === "none") return;
      const st = statusOf(k, d);
      el.classList.toggle("done", st === "done");
      el.classList.toggle("moved", st === "moved");
      el.classList.toggle("cancelled", st === "cancelled");
      el.appendChild(statusControl(k, d, () => { renderCalendar(); renderDetail(); renderNotes(); }));
    });
  }

  const noteText = document.getElementById("note-text");
  const noteLabel = document.getElementById("note-label");
  const noteSave = document.getElementById("note-save");
  const noteRemove = document.getElementById("note-remove");
  const noteStatus = document.getElementById("note-status");
  const noteList = document.getElementById("note-list");

  const noteFreq = document.getElementById("note-freq");
  const noteUntil = document.getElementById("note-until");
  const untilField = document.getElementById("until-field");
  const seriesInfo = document.getElementById("series-info");
  let editingKey = null;
  let editingDate = null;
  const statusField = document.getElementById("status-field");
  const statusCtrl = document.getElementById("status-ctrl");
  const statusLabel = document.getElementById("status-label");
  const notePick = document.getElementById("note-pick");

  const fmt = k => { const d = parseIso(k); return `${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}, ${d.getFullYear()}`; };
  // "For" dropdown next to Until: "years,months" added to the start date fills Until.
  function wireSpan(spanSel, untilInput, startOf) {
    spanSel.addEventListener("change", () => {
      if (!spanSel.value) return;
      const [yy, mm] = spanSel.value.split(",").map(Number);
      const d = parseIso(startOf());
      untilInput.value = iso(new Date(d.getFullYear() + yy, d.getMonth() + mm, d.getDate()));
    });
    untilInput.addEventListener("input", () => { spanSel.value = ""; });
  }
  // Day / Month / Year dropdowns kept in sync with a date input. Returns a function to refresh them from the input.
  function wireDMY(input, px) {

    function open(fresh) {
      if (fresh) { try { localStorage.setItem(GRACE, String(Date.now() + HOUR)); } catch (e) {} }
      document.documentElement.classList.remove("locked"); pin.value = ""; pin2.value = "";
    }
    function endGrace() { try { localStorage.removeItem(GRACE); } catch (e) {} }
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const p = pin.value.trim();
      if (mode === "create" || mode === "change") {
        if (!/^\d{6,8}$/.test(p)) { err.textContent = "Use 6 to 8 digits."; return; }
        if (p !== pin2.value.trim()) { err.textContent = "The two PINs don't match."; return; }
        if (!(await setPin(p))) { err.textContent = "This browser is blocking storage, so the PIN can't be saved."; return; }
        const wasChange = mode === "change";
        open(true);
        if (window.calSync) calSync.unlocked(p, wasChange);
        if (window.DwineSync && !DwineSync.signedIn()) DwineSync.login(p);
      } else if (await matches(p)) {
        if (mode === "current") show("change");
        else {
          open(true);
          if (window.calSync) calSync.unlocked(p, false);
          // The same PIN signs this browser in to sync for the rest of the site.
          if (window.DwineSync && !DwineSync.signedIn() && /^\d{6,8}$/.test(p)) DwineSync.login(p);
        }
      } else {
        err.textContent = "Wrong PIN."; pin.value = ""; pin.focus();
      }
    });
    cancel.addEventListener("click", () => open(false));
    forgot.addEventListener("click", () => {
      if (!confirm("Resetting the PIN deletes the notes saved on this device, so nobody can get around the lock. Notes synced online stay there and come back when you enter your old PIN. Continue?")) return;
      try { ["calender1.notes", "calender1.vault", "calender1.dirty", "calender1.syncedAt", GRACE].forEach(k => localStorage.removeItem(k)); localStorage.removeItem(KEY); } catch (e) {}
      location.reload();
    });
    $("btn-lock").addEventListener("click", () => { endGrace(); if (window.calSync) calSync.locked(); show(read() ? "unlock" : "create"); });
    $("btn-pin").addEventListener("click", () => show(read() ? "current" : "create"));
    let until = 0;
    try { until = +localStorage.getItem(GRACE) || 0; } catch (e) {}
    if (read() && Date.now() < until) open(false);
    else { if (window.calSync) calSync.locked(); show(read() ? "unlock" : "create"); }
  })();
</script>
</body>
