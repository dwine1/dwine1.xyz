<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<title>Notes · dwine1.xyz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root {
    --bg: #eef1f4; --fg: #16202b; --muted: #5b6876; --line: #d3dae2; --accent: #2b4fd8;
    --card: #ffffff; --danger: #b42318; --mark: #ffe58a;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f141a; --fg: #e6ebf1; --muted: #93a0ae; --line: #27313c; --accent: #8ea6ff; --card: #161d25; --danger: #ff8a7a; --mark: #6b5a12; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0f141a; --fg: #e6ebf1; --muted: #93a0ae; --line: #27313c; --accent: #8ea6ff; --card: #161d25; --danger: #ff8a7a; --mark: #6b5a12; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.55; }
  .wrap {
    max-width: 44rem; margin: 0 auto; padding-block: 2rem 4rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 2rem;
  }
  .back { font-family: var(--mono); font-size: .85rem; color: var(--accent); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin: 0; }
  .lede { margin: .5rem 0 0; color: var(--muted); }
  main { display: grid; gap: 1.5rem; border-top: 1px solid var(--line); padding-top: 1.5rem; }
  form { display: grid; gap: .6rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
  input, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .55rem .7rem; width: 100%; }
  textarea { min-height: 8rem; resize: vertical; }
  #title { font-weight: 700; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row .grow { flex: 1; }
  .hint { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
  button { font: inherit; font-size: .9rem; cursor: pointer; border-radius: 8px; padding: .45rem .85rem; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
  button.danger { color: var(--danger); }
  button:hover { filter: brightness(.96); }
  .tools { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .tools input { flex: 1 1 12rem; width: auto; }
  .export .label { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
  .export .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 .25rem; }
  button:disabled { opacity: .6; cursor: progress; }
  .count { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
  li.note { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem; display: grid; gap: .4rem; }
  li.note h2 { font-size: 1.05rem; margin: 0; overflow-wrap: anywhere; }
  .meta { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .actions { display: flex; gap: .5rem; justify-content: flex-end; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; }
  .empty { color: var(--muted); text-align: center; padding: 2rem 1rem; border: 1px dashed var(--line); border-radius: 12px; }
  .toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: .6rem .8rem .6rem 1rem; border-radius: 10px; display: flex; gap: .75rem; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .toast button { background: transparent; color: var(--bg); border-color: var(--bg); padding: .25rem .6rem; }
  .toast[hidden] { display: none; }
</style>
<script src="../../sync.js?v=2" data-keys="dwine1-notes-v1"></script>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../index.html">← All projects</a>
    <header>
      <h1>Notes</h1>
      <p class="lede">Write a note, save it, and find it later. Notes stay in this browser; use Backup to keep a copy you can import later.</p>
    </header>
    <main>
      <form id="form" autocomplete="off">
        <input id="title" placeholder="Title" maxlength="200" aria-label="Title">
        <textarea id="body" placeholder="Write your note…" aria-label="Note"></textarea>
        <div class="row">
          <span class="hint grow" id="hint">Ctrl/⌘ + Enter to save</span>
          <button type="button" id="cancel" hidden>Cancel edit</button>
          <button type="submit" class="primary" id="save">Save note</button>
        </div>
      </form>

      <div class="tools">
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes">
      </div>
      <div class="tools export" role="group" aria-labelledby="exportLabel">
        <span class="label" id="exportLabel">Export all</span>
        <button type="button" id="dl-pdf">PDF</button>
        <button type="button" id="dl-txt">Text file</button>
        <button type="button" id="email">Email</button>
        <button type="button" id="share" hidden>Share…</button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" id="export" title="Backup file you can import later">Backup</button>
        <button type="button" id="import">Import</button>
        <input type="file" id="file" accept="application/json,.json" hidden>
      </div>
      <div class="count" id="count"></div>
      <ul id="list"></ul>
    </main>
  </div>
  <div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button type="button" id="undo" hidden>Undo</button></div>

<script>
(() => {
  const KEY = "dwine1-notes-v1";
  const $ = id => document.getElementById(id);
  const form = $("form"), titleEl = $("title"), bodyEl = $("body"), list = $("list"), search = $("search");
  let notes = load();
  let editingId = null;
  let lastRemoved = null, toastTimer = null;

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY) || "[]");
      return Array.isArray(data) ? data.filter(n => n && n.id) : [];
    } catch { return []; }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(notes)); }
    catch { toast("Could not save in this browser. Use Export to keep a copy."); }
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const fmt = t => new Date(t).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "medium" });

  function highlight(el, text, q) {
    el.textContent = "";
    if (!q) { el.textContent = text; return; }
    const lower = text.toLocaleLowerCase(), ql = q.toLocaleLowerCase();
    let i = 0, j;
    while ((j = lower.indexOf(ql, i)) !== -1) {
      el.append(text.slice(i, j));
      const m = document.createElement("mark"); m.textContent = text.slice(j, j + q.length); el.append(m);
      i = j + q.length;
    }
    el.append(text.slice(i));
  }

  function render() {
    const q = search.value.trim();
    const ql = q.toLocaleLowerCase();
    const sorted = [...notes].sort((a, b) => b.created - a.created);
    const shown = q ? sorted.filter(n => (n.title + "\n" + n.body).toLocaleLowerCase().includes(ql)) : sorted;
    list.textContent = "";
    $("count").textContent = notes.length
      ? (q ? `${shown.length} of ${notes.length} notes` : `${notes.length} note${notes.length === 1 ? "" : "s"}`)
      : "";
    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = notes.length ? "No notes match your search." : "No notes yet. Write your first one above.";
      list.append(li);
      return;
    }
    for (const n of shown) {
      const li = document.createElement("li"); li.className = "note";
      const h = document.createElement("h2"); highlight(h, n.title || "Untitled", q);
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = fmt(n.created) + (n.updated && n.updated !== n.created ? ` · edited ${fmt(n.updated)}` : "");
      li.append(h, meta);
      if (n.body) { const p = document.createElement("p"); p.className = "text"; highlight(p, n.body, q); li.append(p); }
      const actions = document.createElement("div"); actions.className = "actions";
      const edit = document.createElement("button"); edit.type = "button"; edit.textContent = "Edit";
      edit.onclick = () => startEdit(n.id);
      const del = document.createElement("button"); del.type = "button"; del.className = "danger"; del.textContent = "Remove";
      del.setAttribute("aria-label", `Remove note ${n.title || "Untitled"}`);
      del.onclick = () => remove(n.id);
      actions.append(edit, del); li.append(actions);
      list.append(li);
    }
  }

  function resetForm() {
    editingId = null; form.reset();
    $("save").textContent = "Save note"; $("cancel").hidden = true;
  }
  function startEdit(id) {
    const n = notes.find(x => x.id === id); if (!n) return;
    editingId = id; titleEl.value = n.title; bodyEl.value = n.body;
    $("save").textContent = "Update note"; $("cancel").hidden = false;
    form.scrollIntoView({ behavior: "smooth", block: "start" }); bodyEl.focus();
  }
  function remove(id) {
    const i = notes.findIndex(x => x.id === id); if (i < 0) return;
    lastRemoved = notes[i];
    notes.splice(i, 1); persist();
    if (editingId === id) resetForm();
    render();
    toast(`Removed “${lastRemoved.title || "Untitled"}”`, true);
  }
  function toast(text, undo) {
    $("toastText").textContent = text; $("undo").hidden = !undo; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; lastRemoved = null; }, 6000);
  }
  $("undo").onclick = () => {
    if (lastRemoved && !notes.some(n => n.id === lastRemoved.id)) { notes.push(lastRemoved); persist(); render(); }
    lastRemoved = null; $("toast").hidden = true;
  };

  form.addEventListener("submit", e => {
    e.preventDefault();
    const title = titleEl.value.trim(), body = bodyEl.value.replace(/\s+$/, "");
    if (!title && !body.trim()) { bodyEl.focus(); return; }
    const now = Date.now();
    if (editingId) {
      const n = notes.find(x => x.id === editingId);
      if (n) Object.assign(n, { title, body, updated: now });
    } else {
      notes.push({ id: uid(), title, body, created: now, updated: now });
    }
    persist(); resetForm(); search.value = ""; render(); titleEl.focus();
  });
  form.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); }
  });
  $("cancel").onclick = resetForm;
  search.addEventListener("input", render);

  $("export").onclick = () => {
    const blob = new Blob([JSON.stringify({ app: "dwine1-notes", version: 1, notes }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `notes-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("import").onclick = () => $("file").click();
  $("file").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const incoming = (Array.isArray(data) ? data : data.notes) || [];
      let added = 0;
      for (const n of incoming) {
        if (!n || (typeof n.title !== "string" && typeof n.body !== "string")) continue;
        const note = {
          id: typeof n.id === "string" ? n.id : uid(),
          title: String(n.title || ""), body: String(n.body || ""),
          created: Number(n.created) || Date.now(), updated: Number(n.updated) || Number(n.created) || Date.now()
        };
        const existing = notes.find(x => x.id === note.id);
        if (existing) { if (note.updated > (existing.updated || 0)) Object.assign(existing, note); }
        else { notes.push(note); added++; }
      }
      persist(); render();
      toast(`Imported ${added} new note${added === 1 ? "" : "s"}.`);
    } catch { toast("That file isn't a notes export."); }
  };

  // ---- Export all: PDF, text, email, share ----
  const CDN = "https://cdn.jsdelivr.net/npm/";
  const stamp = () => new Date().toISOString().slice(0, 10);
  const newestFirst = () => [...notes].sort((a, b) => b.created - a.created);
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = () => { s.remove(); reject(new Error(src)); };
      document.head.append(s);
    });
  }
  function needNotes() {
    if (notes.length) return true;
    toast("There are no notes to export yet."); return false;
  }
  async function busy(btn, fn) {
    if (!needNotes()) return;
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Preparing…";
    try { await fn(); }
    catch (err) { if (err && err.name !== "AbortError") toast("Couldn't make the file. Check your connection and try again."); }
    finally { btn.disabled = false; btn.textContent = label; }
  }
  function download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function notesText() {
    const out = [`Notes · ${notes.length} note${notes.length === 1 ? "" : "s"} · exported ${fmt(Date.now())}`, ""];
    for (const n of newestFirst()) {
      out.push("────────────────────", n.title || "Untitled", fmt(n.created) + (n.updated && n.updated !== n.created ? ` (edited ${fmt(n.updated)})` : ""), "");
      if (n.body) out.push(n.body, "");
    }
    return out.join("\n");
  }

  let pdfFont;
  async function loadPdfFont() {
    // DejaVu covers Turkish and other accented letters that the built-in PDF fonts lack.
    if (pdfFont === undefined) {
      try {
        const res = await fetch(CDN + "dejavu-fonts-ttf@2.37.3/ttf/DejaVuSans.ttf");
        if (!res.ok) throw new Error(res.status);
        const bytes = new Uint8Array(await res.arrayBuffer());
        let bin = "";
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        pdfFont = btoa(bin);
      } catch { pdfFont = null; }
    }
    return pdfFont;
  }
  async function makePdf() {
    await loadScript(CDN + "jspdf@2.5.1/dist/jspdf.umd.min.js");
    const font = await loadPdfFont();
    const doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    let family = "helvetica";
    if (font) {
      doc.addFileToVFS("DejaVuSans.ttf", font);
      doc.addFont("DejaVuSans.ttf", "DejaVu", "normal");
      family = "DejaVu";
    }
    // Without the font, drop accents so nothing turns into garbage characters.
    const txt = v => font ? String(v) : String(v).replace(/ı/g, "i").replace(/İ/g, "I").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const M = 48, width = W - M * 2;
    let y = M;
    const line = (text, size, color, gap) => {
      doc.setFontSize(size); doc.setTextColor(color);
      const lh = size * 1.35;
      for (const l of doc.splitTextToSize(txt(text), width)) {
        if (y + lh > H - M) { doc.addPage(); y = M; }
        doc.text(l, M, y + size); y += lh;
      }
      y += gap || 0;
    };
    doc.setFont(family, "normal");
    line("Notes", 20, 20, 2);
    line(`${notes.length} note${notes.length === 1 ? "" : "s"} · exported ${fmt(Date.now())}`, 9, 110, 14);
    for (const n of newestFirst()) {
      if (y + 60 > H - M) { doc.addPage(); y = M; }
      doc.setDrawColor(210); doc.line(M, y, W - M, y); y += 10;
      line(n.title || "Untitled", 13, 20, 1);
      line(fmt(n.created) + (n.updated && n.updated !== n.created ? ` · edited ${fmt(n.updated)}` : ""), 8.5, 120, 6);
      if (n.body) line(n.body, 10.5, 40, 0);
      y += 14;
    }
    return doc;
  }

  $("dl-pdf").onclick = e => busy(e.currentTarget, async () => (await makePdf()).save(`notes-${stamp()}.pdf`));
  $("dl-txt").onclick = () => { if (needNotes()) download(new Blob([notesText()], { type: "text/plain;charset=utf-8" }), `notes-${stamp()}.txt`); };
  $("email").onclick = () => {
    if (!needNotes()) return;
    // Email links get cut off when they are very long, so long exports are shortened.
    const LIMIT = 6000;
    let body = notesText();
    if (body.length > LIMIT) body = body.slice(0, LIMIT) + "\n\n… (shortened; use the PDF or Text file button for everything)";
    location.href = `mailto:?subject=${encodeURIComponent(`My notes (${stamp()})`)}&body=${encodeURIComponent(body)}`;
  };
  if (navigator.share) {
    $("share").hidden = false;
    // Making the PDF can take long enough that the browser no longer counts the tap
    // (Safari is strict), so the prepared file is kept and a second tap shares it at once.
    let prepared = null;
    const shareBtn = $("share");
    shareBtn.onclick = async () => {
      if (!needNotes()) return;
      const key = JSON.stringify(notes), title = `My notes (${stamp()})`;
      if (!prepared || prepared.key !== key) {
        shareBtn.disabled = true; shareBtn.textContent = "Preparing…";
        let file = null;
        try {
          const blob = (await makePdf()).output("blob");
          file = new File([blob], `notes-${stamp()}.pdf`, { type: "application/pdf" });
          if (!(navigator.canShare && navigator.canShare({ files: [file] }))) file = null;
        } catch {}
        prepared = { key, data: file ? { title, files: [file] } : { title, text: notesText() } };
        shareBtn.disabled = false; shareBtn.textContent = "Share…";
      }
      try { await navigator.share(prepared.data); }
      catch (err) {
        if (err && err.name === "NotAllowedError") { shareBtn.textContent = "Tap again to share"; return; }
        if (err && err.name !== "AbortError") toast("Sharing didn't work here. Try the PDF or Email button.");
      }
      shareBtn.textContent = "Share…";
    };
  }

  window.addEventListener("storage", e => { if (e.key === KEY) { notes = load(); render(); } });
  render();
})();
</script>
</body>
</html>
