<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<title>Notes · dwine1.xyz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root {
    --bg: #eef1f4; --fg: #16202b; --muted: #5b6876; --line: #d3dae2; --accent: #2b4fd8;
    --card: #ffffff; --danger: #b42318; --mark: #ffe58a;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f141a; --fg: #e6ebf1; --muted: #93a0ae; --line: #27313c; --accent: #8ea6ff; --card: #161d25; --danger: #ff8a7a; --mark: #6b5a12; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0f141a; --fg: #e6ebf1; --muted: #93a0ae; --line: #27313c; --accent: #8ea6ff; --card: #161d25; --danger: #ff8a7a; --mark: #6b5a12; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.55; }
  .wrap {
    max-width: 44rem; margin: 0 auto; padding-block: 2rem 4rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 2rem;
  }
  .back { font-family: var(--mono); font-size: .85rem; color: var(--accent); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin: 0; }
  .lede { margin: .5rem 0 0; color: var(--muted); }
  main { display: grid; gap: 1.5rem; border-top: 1px solid var(--line); padding-top: 1.5rem; }
  form { display: grid; gap: .6rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
  input, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .55rem .7rem; width: 100%; }
  textarea { min-height: 8rem; resize: vertical; }
  #title { font-weight: 700; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row .grow { flex: 1; }
  .hint { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
  button { font: inherit; font-size: .9rem; cursor: pointer; border-radius: 8px; padding: .45rem .85rem; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
  button.danger { color: var(--danger); }
  button:hover { filter: brightness(.96); }
  .tools { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .tools input { flex: 1 1 12rem; width: auto; }
  .count { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
  li.note { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem; display: grid; gap: .4rem; }
  li.note h2 { font-size: 1.05rem; margin: 0; overflow-wrap: anywhere; }
  .meta { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .actions { display: flex; gap: .5rem; justify-content: flex-end; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; }
  .empty { color: var(--muted); text-align: center; padding: 2rem 1rem; border: 1px dashed var(--line); border-radius: 12px; }
  .toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: .6rem .8rem .6rem 1rem; border-radius: 10px; display: flex; gap: .75rem; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .toast button { background: transparent; color: var(--bg); border-color: var(--bg); padding: .25rem .6rem; }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../index.html">← All projects</a>
    <header>
      <h1>Notes</h1>
      <p class="lede">Write a note, save it, and find it later. Notes stay in this browser; use Export to back them up.</p>
    </header>
    <main>
      <form id="form" autocomplete="off">
        <input id="title" placeholder="Title" maxlength="200" aria-label="Title">
        <textarea id="body" placeholder="Write your note…" aria-label="Note"></textarea>
        <div class="row">
          <span class="hint grow" id="hint">Ctrl/⌘ + Enter to save</span>
          <button type="button" id="cancel" hidden>Cancel edit</button>
          <button type="submit" class="primary" id="save">Save note</button>
        </div>
      </form>

      <div class="tools">
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes">
        <button type="button" id="export">Export</button>
        <button type="button" id="import">Import</button>
        <input type="file" id="file" accept="application/json,.json" hidden>
      </div>
      <div class="count" id="count"></div>
      <ul id="list"></ul>
    </main>
  </div>
  <div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button type="button" id="undo" hidden>Undo</button></div>

<script>
(() => {
  const KEY = "dwine1-notes-v1";
  const $ = id => document.getElementById(id);
  const form = $("form"), titleEl = $("title"), bodyEl = $("body"), list = $("list"), search = $("search");
  let notes = load();
  let editingId = null;
  let lastRemoved = null, toastTimer = null;

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY) || "[]");
      return Array.isArray(data) ? data.filter(n => n && n.id) : [];
    } catch { return []; }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(notes)); }
    catch { toast("Could not save in this browser. Use Export to keep a copy."); }
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const fmt = t => new Date(t).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

  function highlight(el, text, q) {
    el.textContent = "";
    if (!q) { el.textContent = text; return; }
    const lower = text.toLocaleLowerCase(), ql = q.toLocaleLowerCase();
    let i = 0, j;
    while ((j = lower.indexOf(ql, i)) !== -1) {
      el.append(text.slice(i, j));
      const m = document.createElement("mark"); m.textContent = text.slice(j, j + q.length); el.append(m);
      i = j + q.length;
    }
    el.append(text.slice(i));
  }

  function render() {
    const q = search.value.trim();
    const ql = q.toLocaleLowerCase();
    const sorted = [...notes].sort((a, b) => b.created - a.created);
    const shown = q ? sorted.filter(n => (n.title + "\n" + n.body).toLocaleLowerCase().includes(ql)) : sorted;
    list.textContent = "";
    $("count").textContent = notes.length
      ? (q ? `${shown.length} of ${notes.length} notes` : `${notes.length} note${notes.length === 1 ? "" : "s"}`)
      : "";
    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = notes.length ? "No notes match your search." : "No notes yet. Write your first one above.";
      list.append(li);
      return;
    }
    for (const n of shown) {
      const li = document.createElement("li"); li.className = "note";
      const h = document.createElement("h2"); highlight(h, n.title || "Untitled", q);
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = fmt(n.created) + (n.updated && n.updated !== n.created ? ` · edited ${fmt(n.updated)}` : "");
      li.append(h, meta);
      if (n.body) { const p = document.createElement("p"); p.className = "text"; highlight(p, n.body, q); li.append(p); }
      const actions = document.createElement("div"); actions.className = "actions";
      const edit = document.createElement("button"); edit.type = "button"; edit.textContent = "Edit";
      edit.onclick = () => startEdit(n.id);
      const del = document.createElement("button"); del.type = "button"; del.className = "danger"; del.textContent = "Remove";
      del.setAttribute("aria-label", `Remove note ${n.title || "Untitled"}`);
      del.onclick = () => remove(n.id);
      actions.append(edit, del); li.append(actions);
      list.append(li);
    }
  }

  function resetForm() {
    editingId = null; form.reset();
    $("save").textContent = "Save note"; $("cancel").hidden = true;
  }
  function startEdit(id) {
    const n = notes.find(x => x.id === id); if (!n) return;
    editingId = id; titleEl.value = n.title; bodyEl.value = n.body;
    $("save").textContent = "Update note"; $("cancel").hidden = false;
    form.scrollIntoView({ behavior: "smooth", block: "start" }); bodyEl.focus();
  }
  function remove(id) {
    const i = notes.findIndex(x => x.id === id); if (i < 0) return;
    lastRemoved = notes[i];
    notes.splice(i, 1); persist();
    if (editingId === id) resetForm();
    render();
    toast(`Removed “${lastRemoved.title || "Untitled"}”`, true);
  }
  function toast(text, undo) {
    $("toastText").textContent = text; $("undo").hidden = !undo; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; lastRemoved = null; }, 6000);
  }
  $("undo").onclick = () => {
    if (lastRemoved && !notes.some(n => n.id === lastRemoved.id)) { notes.push(lastRemoved); persist(); render(); }
    lastRemoved = null; $("toast").hidden = true;
  };

  form.addEventListener("submit", e => {
    e.preventDefault();
    const title = titleEl.value.trim(), body = bodyEl.value.replace(/\s+$/, "");
    if (!title && !body.trim()) { bodyEl.focus(); return; }
    const now = Date.now();
    if (editingId) {
      const n = notes.find(x => x.id === editingId);
      if (n) Object.assign(n, { title, body, updated: now });
    } else {
      notes.push({ id: uid(), title, body, created: now, updated: now });
    }
    persist(); resetForm(); search.value = ""; render(); titleEl.focus();
  });
  form.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); }
  });
  $("cancel").onclick = resetForm;
  search.addEventListener("input", render);

  $("export").onclick = () => {
    const blob = new Blob([JSON.stringify({ app: "dwine1-notes", version: 1, notes }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `notes-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("import").onclick = () => $("file").click();
  $("file").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const incoming = (Array.isArray(data) ? data : data.notes) || [];
      let added = 0;
      for (const n of incoming) {
        if (!n || (typeof n.title !== "string" && typeof n.body !== "string")) continue;
        const note = {
          id: typeof n.id === "string" ? n.id : uid(),
          title: String(n.title || ""), body: String(n.body || ""),
          created: Number(n.created) || Date.now(), updated: Number(n.updated) || Number(n.created) || Date.now()
        };
        const existing = notes.find(x => x.id === note.id);
        if (existing) { if (note.updated > (existing.updated || 0)) Object.assign(existing, note); }
        else { notes.push(note); added++; }
      }
      persist(); render();
      toast(`Imported ${added} new note${added === 1 ? "" : "s"}.`);
    } catch { toast("That file isn't a notes export."); }
  };

  window.addEventListener("storage", e => { if (e.key === KEY) { notes = load(); render(); } });
  render();
})();
</script>
</body>
</html>
